<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Markdown Reader — live preview & analysis">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c83ff"/>
      <stop offset="1" stop-color="#9333ea"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="64" y="64" width="1072" height="502" rx="24" fill="#0b0e14" stroke="#283040" stroke-width="2"/>
  <!-- brand mark -->
  <rect x="104" y="104" width="92" height="92" rx="20" fill="url(#mark)"/>
  <text x="150" y="168" font-family="-apple-system, Segoe UI, Roboto, sans-serif" font-size="54" font-weight="800" fill="#ffffff" text-anchor="middle">M&#8595;</text>
  <text x="224" y="170" font-family="-apple-system, Segoe UI, Roboto, sans-serif" font-size="58" font-weight="800" fill="#e6edf3">Markdown Reader</text>
  <text x="106" y="300" font-family="-apple-system, Segoe UI, Roboto, sans-serif" font-size="44" font-weight="700" fill="#e6edf3">Read, preview &amp; analyze Markdown</text>
  <text x="106" y="360" font-family="-apple-system, Segoe UI, Roboto, sans-serif" font-size="30" fill="#9aa5b5">Live split-pane editor · load from any URL · JSON analysis API</text>
  <!-- feature chips -->
  <g font-family="-apple-system, Segoe UI, Roboto, sans-serif" font-size="24" font-weight="600">
    <rect x="106" y="420" width="220" height="58" rx="29" fill="#1e2440"/>
    <text x="216" y="457" fill="#7c83ff" text-anchor="middle">Live Preview</text>
    <rect x="342" y="420" width="200" height="58" rx="29" fill="#1e2440"/>
    <text x="442" y="457" fill="#7c83ff" text-anchor="middle">Dark Mode</text>
    <rect x="558" y="420" width="250" height="58" rx="29" fill="#1e2440"/>
    <text x="683" y="457" fill="#7c83ff" text-anchor="middle">Analysis API</text>
    <rect x="824" y="420" width="240" height="58" rx="29" fill="#1e2440"/>
    <text x="944" y="457" fill="#7c83ff" text-anchor="middle">URL Loader</text>
  </g>
</svg>
